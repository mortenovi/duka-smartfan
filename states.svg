<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" role="img">
<title>Duka Smartfan state diagram</title>
<desc>Five states that exclude each other: off, idle, 24 hour mode, boost, and no answer. The arrows show which commands lead between them. Measured on the unit on 3 October 2026.</desc>
<style>
  text { font-family: "Segoe UI", system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .t  { font-size: 14px; }
  .ts { font-size: 12px; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .lbl { fill: #44443F; }
  .gray-f { fill: #F1EFE8; stroke: #888780; stroke-width: .5; }
  .gray-t { fill: #2C2C2A; } .gray-s { fill: #5F5E5A; }
  .teal-f { fill: #E1F5EE; stroke: #1D9E75; stroke-width: .5; }
  .teal-t { fill: #04342C; } .teal-s { fill: #0F6E56; }
  .purple-f { fill: #EEEDFE; stroke: #7F77DD; stroke-width: .5; }
  .purple-t { fill: #26215C; } .purple-s { fill: #534AB7; }
  .dash { fill: none; stroke: #888780; stroke-width: .5; stroke-dasharray: 4 4; }
  .head { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
  @media (prefers-color-scheme: dark) {
    .lbl { fill: #D3D1C7; } .arr { stroke: #B4B2A9; }
    .gray-f { fill: #2C2C2A; stroke: #888780; }
    .gray-t { fill: #F1EFE8; } .gray-s { fill: #D3D1C7; }
    .teal-f { fill: #04342C; stroke: #5DCAA5; }
    .teal-t { fill: #E1F5EE; } .teal-s { fill: #9FE1CB; }
    .purple-f { fill: #26215C; stroke: #AFA9EC; }
    .purple-t { fill: #EEEDFE; } .purple-s { fill: #CECBF6; }
    .head { fill: #F1EFE8; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="head" x="40" y="30">Duka Smartfan — states and what moves between them</text>

<rect class="gray-f" x="200" y="60" width="280" height="60" rx="4"/>
<text class="th gray-t" x="340" y="86" text-anchor="middle">Off</text>
<text class="ts gray-s" x="340" y="106" text-anchor="middle">no power, not spinning</text>

<rect class="gray-f" x="200" y="180" width="280" height="60" rx="4"/>
<text class="th gray-t" x="340" y="206" text-anchor="middle">Idle</text>
<text class="ts gray-s" x="340" y="226" text-anchor="middle">power on, not spinning</text>

<rect class="teal-f" x="200" y="300" width="280" height="60" rx="4"/>
<text class="th teal-t" x="340" y="326" text-anchor="middle">24 hour mode</text>
<text class="ts teal-s" x="340" y="346" text-anchor="middle">930 rpm</text>

<rect class="purple-f" x="200" y="420" width="280" height="60" rx="4"/>
<text class="th purple-t" x="340" y="446" text-anchor="middle">Boost</text>
<text class="ts purple-s" x="340" y="466" text-anchor="middle">1440 rpm, 15 minutes</text>

<line class="arr" x1="310" y1="124" x2="310" y2="174" marker-end="url(#arrow)"/>
<text class="ts lbl" x="300" y="153" text-anchor="end">power on</text>
<line class="arr" x1="370" y1="174" x2="370" y2="124" marker-end="url(#arrow)"/>
<text class="ts lbl" x="380" y="153" text-anchor="start">power off</text>

<line class="arr" x1="310" y1="244" x2="310" y2="294" marker-end="url(#arrow)"/>
<text class="ts lbl" x="300" y="273" text-anchor="end">24 hour mode on</text>
<line class="arr" x1="370" y1="294" x2="370" y2="244" marker-end="url(#arrow)"/>
<text class="ts lbl" x="380" y="273" text-anchor="start">24 hour mode off</text>

<line class="arr" x1="310" y1="364" x2="310" y2="414" marker-end="url(#arrow)"/>
<text class="ts lbl" x="300" y="393" text-anchor="end">short press</text>
<line class="arr" x1="370" y1="414" x2="370" y2="364" marker-end="url(#arrow)"/>
<text class="ts lbl" x="380" y="385" text-anchor="start">boost ends,</text>
<text class="ts lbl" x="380" y="403" text-anchor="start">24 hour mode on</text>

<polyline class="arr" points="480,90 560,90 560,450 486,450" marker-end="url(#arrow)"/>
<line class="arr" x1="480" y1="210" x2="560" y2="210"/>
<text class="ts lbl" x="572" y="265" text-anchor="start">short press</text>

<polyline class="arr" points="200,450 140,450 140,210 194,210" marker-end="url(#arrow)"/>
<text class="ts lbl" x="128" y="320" text-anchor="end">boost ends,</text>
<text class="ts lbl" x="128" y="338" text-anchor="end">24 hour mode off</text>

<rect class="dash" x="200" y="530" width="280" height="55" rx="4"/>
<text class="th gray-t" x="340" y="555" text-anchor="middle">No answer</text>
<text class="ts gray-s" x="340" y="574" text-anchor="middle">the button does nothing</text>

<rect class="gray-f" x="186" y="607" width="12" height="12" rx="2"/>
<text class="ts lbl" x="204" y="617" text-anchor="start">not spinning</text>
<rect class="teal-f" x="296" y="607" width="12" height="12" rx="2"/>
<text class="ts lbl" x="314" y="617" text-anchor="start">running constantly</text>
<rect class="purple-f" x="436" y="607" width="12" height="12" rx="2"/>
<text class="ts lbl" x="454" y="617" text-anchor="start">running at full speed</text>

<text class="ts lbl" x="40" y="645">Measured on the unit, 3 October 2026. See PROTOCOL.md for the measurements behind each arrow.</text>
</svg>
