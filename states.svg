<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img">
<title>Duka Smartfan state diagram</title>
<desc>Six states that exclude each other: off, idle, 24 hour mode, boost, sensor driven and no answer. The arrows show which commands and which sensors lead between them. Measured on the unit on 3 October 2026.</desc>
<style>
  text { font-family: "Segoe UI", system-ui, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  .arrs { stroke: #BA7517; stroke-width: 1.5; fill: none; }
  .lbl { fill: #44443F; }
  .lbls { fill: #854F0B; }
  .gray-f { fill: #F1EFE8; stroke: #888780; stroke-width: .5; }
  .gray-t { fill: #2C2C2A; } .gray-s { fill: #5F5E5A; }
  .teal-f { fill: #E1F5EE; stroke: #1D9E75; stroke-width: .5; }
  .teal-t { fill: #04342C; } .teal-s { fill: #0F6E56; }
  .purple-f { fill: #EEEDFE; stroke: #7F77DD; stroke-width: .5; }
  .purple-t { fill: #26215C; } .purple-s { fill: #534AB7; }
  .amber-f { fill: #FAEEDA; stroke: #BA7517; stroke-width: .5; }
  .amber-t { fill: #412402; } .amber-s { fill: #854F0B; }
  .dash { fill: none; stroke: #888780; stroke-width: .5; stroke-dasharray: 4 4; }
  .head { fill: #2C2C2A; font-size: 14px; font-weight: 500; }
  @media (prefers-color-scheme: dark) {
    .lbl { fill: #D3D1C7; } .arr { stroke: #B4B2A9; }
    .lbls { fill: #FAC775; } .arrs { stroke: #EF9F27; }
    .gray-f { fill: #2C2C2A; stroke: #888780; }
    .gray-t { fill: #F1EFE8; } .gray-s { fill: #D3D1C7; }
    .teal-f { fill: #04342C; stroke: #5DCAA5; }
    .teal-t { fill: #E1F5EE; } .teal-s { fill: #9FE1CB; }
    .purple-f { fill: #26215C; stroke: #AFA9EC; }
    .purple-t { fill: #EEEDFE; } .purple-s { fill: #CECBF6; }
    .amber-f { fill: #412402; stroke: #EF9F27; }
    .amber-t { fill: #FAEEDA; } .amber-s { fill: #FAC775; }
    .head { fill: #F1EFE8; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="head" x="40" y="30">Duka Smartfan — states and what moves between them</text>

<rect class="gray-f" x="210" y="60" width="280" height="58" rx="4"/>
<text class="th gray-t" x="350" y="85" text-anchor="middle">Off</text>
<text class="ts gray-s" x="350" y="105" text-anchor="middle">no power, not spinning</text>

<rect class="gray-f" x="210" y="180" width="280" height="58" rx="4"/>
<text class="th gray-t" x="350" y="205" text-anchor="middle">Idle</text>
<text class="ts gray-s" x="350" y="225" text-anchor="middle">power on, not spinning</text>

<rect class="teal-f" x="210" y="300" width="280" height="58" rx="4"/>
<text class="th teal-t" x="350" y="325" text-anchor="middle">24 hour mode</text>
<text class="ts teal-s" x="350" y="345" text-anchor="middle">930 rpm</text>

<rect class="purple-f" x="210" y="420" width="280" height="58" rx="4"/>
<text class="th purple-t" x="350" y="445" text-anchor="middle">Boost</text>
<text class="ts purple-s" x="350" y="465" text-anchor="middle">1440 rpm, 15 minutes</text>

<rect class="amber-f" x="210" y="560" width="280" height="68" rx="4"/>
<text class="th amber-t" x="350" y="585" text-anchor="middle">Sensor driven</text>
<text class="ts amber-s" x="350" y="604" text-anchor="middle">up to 1440 rpm</text>
<text class="ts amber-s" x="350" y="620" text-anchor="middle">no countdown, no boost flag</text>

<line class="arr" x1="320" y1="122" x2="320" y2="174" marker-end="url(#arrow)"/>
<text class="ts lbl" x="310" y="152" text-anchor="end">power on</text>
<line class="arr" x1="380" y1="174" x2="380" y2="122" marker-end="url(#arrow)"/>
<text class="ts lbl" x="390" y="152" text-anchor="start">power off</text>

<line class="arr" x1="320" y1="242" x2="320" y2="294" marker-end="url(#arrow)"/>
<text class="ts lbl" x="310" y="272" text-anchor="end">24 hour on</text>
<line class="arr" x1="380" y1="294" x2="380" y2="242" marker-end="url(#arrow)"/>
<text class="ts lbl" x="390" y="272" text-anchor="start">24 hour off</text>

<line class="arr" x1="320" y1="362" x2="320" y2="414" marker-end="url(#arrow)"/>
<text class="ts lbl" x="310" y="392" text-anchor="end">short press</text>
<line class="arr" x1="380" y1="414" x2="380" y2="362" marker-end="url(#arrow)"/>
<text class="ts lbl" x="390" y="384" text-anchor="start">boost ends,</text>
<text class="ts lbl" x="390" y="402" text-anchor="start">24 hour on</text>

<polyline class="arr" points="490,89 578,89 578,449 496,449" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="209" x2="578" y2="209"/>
<text class="ts lbl" x="590" y="265" text-anchor="start">short press</text>

<polyline class="arr" points="210,449 150,449 150,209 204,209" marker-end="url(#arrow)"/>
<text class="ts lbl" x="138" y="320" text-anchor="end">boost ends,</text>
<text class="ts lbl" x="138" y="338" text-anchor="end">24 hour off</text>

<line class="arrs" x1="490" y1="329" x2="578" y2="329"/>
<polyline class="arrs" points="578,329 578,594 496,594" marker-end="url(#arrow)"/>
<line class="arrs" x1="490" y1="104" x2="602" y2="104"/>
<polyline class="arrs" points="602,104 602,620 496,620" marker-end="url(#arrow)"/>
<text class="ts lbls" x="614" y="430" text-anchor="start">a sensor</text>
<text class="ts lbls" x="614" y="448" text-anchor="start">wants</text>
<text class="ts lbls" x="614" y="466" text-anchor="start">ventilation</text>

<rect class="dash" x="210" y="652" width="280" height="30" rx="4"/>
<text class="ts gray-s" x="350" y="672" text-anchor="middle">No answer — the button does nothing</text>

<text class="ts lbl" x="40" y="697">Measured 3 October 2026. Sensor driven running ends by itself, but when and into which state has not been measured.</text>
</svg>
